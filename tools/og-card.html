<!doctype html>
<!--
  Source for public/og.png — the Open Graph / Twitter share card.

  This is not part of the app build. It is rendered to a PNG at exactly
  1200x630 (the size LinkedIn, X and Slack expect) and the result is
  committed to public/og.png.

  To regenerate after editing:
    npx playwright screenshot --viewport-size=1200,630 \
      tools/og-card.html public/og.png

  Colours and fonts are copied from src/index.css so the card matches the
  site: --bg #08080b, --accent #8b7dff, --accent2 #5a4be0, --signal #4ade80.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        background: #08080b;
        font-family: 'DM Sans', sans-serif;
        /* Accent bloom, echoing the hero treatment on the site. */
        background-image:
          radial-gradient(circle at 82% 12%, rgba(139, 125, 255, 0.26), transparent 52%),
          radial-gradient(circle at 8% 96%, rgba(90, 75, 224, 0.18), transparent 46%);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 68px 76px;
      }

      /* ---- top row: monogram + wordmark ---- */
      .top { display: flex; align-items: center; gap: 18px; }

      .monogram {
        width: 66px;
        height: 66px;
        border-radius: 16px;
        background: linear-gradient(150deg, #8b7dff, #5a4be0);
        box-shadow: 0 14px 34px -12px rgba(139, 125, 255, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 500;
        font-size: 24px;
        letter-spacing: 0.02em;
        color: #fff;
      }

      .wordmark {
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        color: #8f8fa3;
        letter-spacing: 0.01em;
      }

      .live {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-left: auto;
        font-family: 'JetBrains Mono', monospace;
        font-size: 14px;
        color: #6f6f80;
      }
      .dot {
        width: 9px; height: 9px; border-radius: 999px;
        background: #4ade80;
        box-shadow: 0 0 12px rgba(74, 222, 128, 0.9);
      }

      /* ---- the statement ---- */
      .statement {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-weight: 400;
        font-size: 56px;
        line-height: 1.26;
        letter-spacing: -0.015em;
        color: #f4f4f8;
      }
      /* Break points are set by hand — auto-wrapping leaves a ragged third line. */
      .statement span.line { display: block; white-space: nowrap; }
      .statement .hl {
        color: #a99fff;
        font-weight: 500;
      }

      /* ---- bottom row ---- */
      .rule { height: 1px; background: rgba(255, 255, 255, 0.11); margin-bottom: 26px; }

      .bottom { display: flex; align-items: flex-end; justify-content: space-between; }

      .name {
        font-family: 'Sora', sans-serif;
        font-weight: 600;
        font-size: 25px;
        color: #f4f4f8;
        letter-spacing: -0.01em;
      }
      .role {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        color: #8b7dff;
        margin-top: 8px;
      }
      .url {
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        color: #6f6f80;
      }
    </style>
  </head>

  <body>
    <div class="top">
      <div class="monogram">HP</div>
      <div class="wordmark">hemanth.poondla</div>
      <div class="live"><span class="dot"></span>open to work</div>
    </div>

    <div class="statement">
      <span class="line">I build GenAI with a banking engineer&rsquo;s</span>
      <span class="line">definition of <span class="hl">&ldquo;working.&rdquo;</span></span>
    </div>

    <div>
      <div class="rule"></div>
      <div class="bottom">
        <div>
          <div class="name">Hemanth Poondla</div>
          <div class="role">AI/GenAI Engineer &middot; RAG &middot; Agents &middot; LLM evaluation</div>
        </div>
        <div class="url">hemanth-poondla.github.io</div>
      </div>
    </div>
  </body>
</html>
