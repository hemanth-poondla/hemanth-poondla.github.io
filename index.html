<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("hp-theme");
          document.documentElement.setAttribute("data-theme", t === "light" || t === "dark" ? t : "light");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Hemanth Poondla | AI/GenAI Engineer</title>
    <meta name="description" content="AI/GenAI Engineer building applied LLM products - RAG systems, LangChain agents, and OpenAI API integrations - backed by 7 years of full-stack product engineering." />
    <meta name="author" content="Hemanth Poondla" />
    <meta name="keywords" content="ai engineer, genai engineer, generative ai, rag, langchain, llm, applied ml, openai api, mcp, model context protocol, mcp server, python, react, typescript" />
    <link rel="canonical" href="https://hemanth-poondla.github.io/" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Share card. Absolute URLs are required — scrapers do not resolve relative
         paths. The file must live in public/, not src/assets/: Vite only emits
         src/assets files that app code imports, so an OG image there would 404.
         Link previews have no light/dark switching, so og.png (dark) is the one
         that ships; og-light.png is the alternate — swap the two URLs below to
         use it. -->
    <meta property="og:site_name" content="Hemanth Poondla" />
    <meta property="og:title" content="Hemanth Poondla | AI/GenAI Engineer" />
    <meta property="og:description" content="AI/GenAI Engineer building applied LLM products - RAG, LangChain agents, and OpenAI API integrations - on 7 years of full-stack engineering." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hemanth-poondla.github.io/" />
    <meta property="og:image" content="https://hemanth-poondla.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Hemanth Poondla - AI/GenAI Engineer. OpenAI, LangChain, LangGraph, RAG, MCP, FastAPI. hemanth-poondla.github.io" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hemanth Poondla | AI/GenAI Engineer" />
    <meta name="twitter:description" content="Applied AI/GenAI Engineer - RAG, LangChain, and OpenAI API - backed by 7 years shipping products." />
    <meta name="twitter:image" content="https://hemanth-poondla.github.io/og.png" />

  </head>

</html>
